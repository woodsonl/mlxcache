[workspace]
resolver = "2"
members = [
    "crates/mlxcache-core",
    "crates/mlxcache-daemon",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
criterion = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding stays enabled: panic=abort silently killed the lock-poisoning
# and task-recovery paths (a poisoned lock poisons only when unwinding
# runs its guards), so abort traded a smaller binary for the daemon's
# self-healing story.
strip = "symbols"
incremental = false
