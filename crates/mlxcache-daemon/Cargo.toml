[package]
name = "mlxcache-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mlxcache-daemon"
path = "src/main.rs"

[dependencies]
mlxcache-core = { path = "../mlxcache-core" }
tokio = { workspace = true }
axum = { workspace = true }
futures-util = "0.3"
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Runtime-independent signal handling for graceful shutdown (see main.rs).
signal-hook = "0.3"
libc = "0.2"
# T13: native tokenization (R4 endgame — zero Python on the hot path). Loads
# the model's tokenizer.json directly; opt-in per model via
# MLXCACHE_NATIVE_TOKENIZER. No hf-hub feature: the daemon never downloads.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# tokenizer.json artifact identity (R1-2): sha256 of the file bytes.
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
portpicker = "0.1"
criterion = { workspace = true }

[[bench]]
name = "hot_path"
harness = false
