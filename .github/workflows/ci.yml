name: CI

on:
  push:
    branches: [init, main]
  pull_request:
  # The real-model gate downloads a model; run it on demand and weekly, not on
  # every PR. Nightly-style coverage catches mlx-lm drift without slowing PRs.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pin the toolchain: dynamic `stable` can add lints and redden CI with no
      # repo change. rust-toolchain.toml pins local + CI to the same version.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The e2e test spawns the Python sidecar over HTTP; it needs uv + deps.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install sidecar deps
        run: uv sync --group dev --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
        env:
          # Keep the real-model round-trip gate skipped; it needs a download.
          MLXCACHE_BENCH_REAL: "0"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Hot-path alloc gate (SSE framer ≤ 1 alloc/frame)
        # Single-threaded on purpose: the counting allocator is process-global,
        # so parallel test-harness threads would leak allocations into the
        # measurement window and flake the tight budgets.
        run: cargo test -p mlxcache-daemon --test alloc_gate --release -- --test-threads=1

  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install deps
        run: uv sync --group dev --locked
      - name: Lint
        run: uv run ruff check sidecar/
      - name: Format
        run: uv run ruff format --check sidecar/
      - name: Test
        run: uv run pytest sidecar/tests/ -v

  # The real mlx-lm round-trip is the product's core claim (resumed generation ==
  # scratch generation). It needs a ~500MB model download + load, so it runs on a
  # schedule and on dispatch, not on every PR. The rest of the suite stays
  # hermetic; this job closes the "real engine never runs in CI" gap.
  realmodel:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Cache the model and HF cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}-Qwen2-0.5B-Instruct
      - name: Install deps (with the mlx extra)
        run: uv sync --group dev --extra mlx --locked
      - name: Real round-trip gate
        run: uv run pytest sidecar/tests/test_roundtrip_real.py -v
        env:
          MLXCACHE_BENCH_REAL: "1"

