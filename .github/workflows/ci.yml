name: CI

on:
  push:
    branches: [init, main]
  pull_request:

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pin the toolchain: dynamic `stable` can add lints and redden CI with no
      # repo change. rust-toolchain.toml pins local + CI to the same version.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The e2e test spawns the Python sidecar over HTTP; it needs uv + deps.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install sidecar deps
        run: uv sync --group dev --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
        env:
          # Keep the real-model round-trip gate skipped; it needs a download.
          MLXCACHE_BENCH_REAL: "0"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install deps
        run: uv sync --group dev --locked
      - name: Lint
        run: uv run ruff check sidecar/
      - name: Format
        run: uv run ruff format --check sidecar/
      - name: Test
        run: uv run pytest sidecar/tests/ -v
