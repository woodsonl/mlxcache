name: CI

on:
  push:
    branches: [init, main]
  pull_request:

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain: dynamic `stable` can add lints and redden CI with no
      # repo change. rust-toolchain.toml pins local + CI to the same version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The e2e test spawns the Python sidecar over HTTP; it needs uv + deps.
      - uses: astral-sh/setup-uv@v5
      - name: Install sidecar deps
        run: uv sync --group dev --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
        env:
          # Keep the real-model round-trip gate skipped; it needs a download.
          MLXCACHE_BENCH_REAL: "0"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync --group dev --locked
      - name: Lint
        run: uv run ruff check sidecar/
      - name: Format
        run: uv run ruff format --check sidecar/
      - name: Test
        run: uv run pytest sidecar/tests/ -v
