[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["sidecar/tests"]
asyncio_mode = "auto"

[project]
name = "mlxcache-sidecar"
version = "0.1.0"
description = "mlx-lm compatibility sidecar for the mlxcache daemon"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidecar/mlxcache_sidecar"]
