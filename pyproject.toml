[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["sidecar/tests"]
asyncio_mode = "auto"

[project]
name = "mlxcache-sidecar"
version = "0.1.3"
description = "mlx-lm compatibility sidecar for the mlxcache daemon"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

[project.optional-dependencies]
# Real-engine adapter (Apple Silicon only). Pinned per docs/ops.md policy:
# a version bump requires the R1-5 round-trip gate to pass again.
mlx = [
    "mlx-lm==0.31.3",
]

[dependency-groups]
dev = [
    # Exact pins (like mlx-lm above): a floor admits a newer release whose
    # behavior can differ between local and CI while the lock still resolves the
    # old one, so a local pass can be a false green. Pins are on direct deps
    # only; transitive deps are pinned by uv.lock, which CI asserts with --locked.
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidecar/mlxcache_sidecar"]
