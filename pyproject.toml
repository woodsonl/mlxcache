[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["sidecar/tests", "scripts/dedup/tests"]
asyncio_mode = "auto"

[project]
name = "mlxcache-sidecar"


version = "0.9.0"

description = "mlx-lm compatibility sidecar for the mlxcache daemon"
requires-python = ">=3.12"
# UNLICENSED until the license decision lands; a PyPI publish is blocked on
# it by design.
license = { text = "UNLICENSED" }
keywords = ["mlx", "kv-cache", "llm", "inference", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/woodsonl/mlxcache"
Documentation = "https://github.com/woodsonl/mlxcache/tree/main/docs"

[project.optional-dependencies]
# Real-engine adapter (Apple Silicon only). Pinned per docs/ops.md policy:
# a version bump requires the R1-5 round-trip gate to pass again.
mlx = [
    "mlx-lm==0.31.3",
]

[dependency-groups]
dev = [
    # Exact pins (like mlx-lm above): a floor admits a newer release whose
    # behavior can differ between local and CI while the lock still resolves the
    # old one, so a local pass can be a false green. Pins are on direct deps
    # only; transitive deps are pinned by uv.lock, which CI asserts with --locked.
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
    # Direct dep of scripts/dedup/ (the chunker/sim toolchain), which the CI
    # python job tests; without this pin numpy only enters the lock via the
    # mlx extra, and `uv sync --group dev` provably uninstalls it.
    "numpy==2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit package selection. mlxcache_store ships as the distribution's
# public API surface — the standalone mlxcache_serve stack embeds it, and
# wheel consumers are its importers. mlxcache_serve itself
# stays unpackaged deliberately: it is a demo wrapper around a real mlx-lm
# process, not a library.
packages = [
    "sidecar/mlxcache_sidecar",
    "sidecar/mlxcache_store",
]
